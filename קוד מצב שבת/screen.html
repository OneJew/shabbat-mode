<!doctype html>
<html lang="he" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>שבת שלום</title>
<link rel="icon" href="__EMBLEM__">
<style>
:root{color-scheme:dark;--night:#071331;--deep:#0b1d49;--panel:#10265a;--gold:#f0c04f;--pale:#fbe7ae;--gdeep:#b98318;--ice:#f4f6fc;--mist:#c3cde6;--line:rgba(240,192,79,.3);--alert:#ffb3a8;--font:"Segoe UI","Segoe UI Variable Text",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-color:var(--gdeep) var(--night)}
body{margin:0;min-height:100vh;background:radial-gradient(90% 46% at 50% 0,rgba(26,79,196,.5),transparent 72%),var(--night);color:var(--ice);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 24px;border-radius:999px;border:1.5px solid rgba(244,246,252,.5);background:transparent;font-weight:700;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:hover{border-color:var(--gold);color:var(--pale)}
.btn:active{transform:scale(.97)}
.btn--gold{background:linear-gradient(180deg,#f7d06c,var(--gold));border-color:var(--gold);color:var(--night)}
.btn--gold:hover{background:var(--pale);color:var(--night)}
.btn--bad{border-color:var(--alert);color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.x{display:grid;place-items:center;width:40px;height:40px;padding:0;background:none;border:0;border-radius:50%;color:var(--mist);font-size:26px;line-height:1;cursor:pointer;flex:none}
.x:hover{color:var(--gold);background:rgba(240,192,79,.12)}
.sig{position:fixed;inset-inline:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:10px 12px 12px;background:linear-gradient(0deg,var(--night) 55%,transparent)}
.sig a{display:inline-flex;align-items:center;gap:11px;min-height:44px;padding:5px 18px;border-radius:999px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#8a5a12,#f7d774,#fff3c4,#d9a034,#8a5a12) border-box;color:#0b192b;text-decoration:none;font-size:14px;font-weight:500;line-height:1;box-shadow:0 6px 18px -8px rgba(0,0,0,.7);transition:transform .22s,box-shadow .22s}
.sig i{width:2px;height:20px;border-radius:2px;background:var(--gdeep);flex:none}
.sig img{display:block;width:30px;height:30px}
.sig b{font-weight:700}
.sig em{max-width:0;margin-inline-start:-11px;overflow:hidden;white-space:nowrap;font-style:normal;font-weight:700;color:var(--gdeep);opacity:0;transition:max-width .32s,margin .32s,opacity .2s}
.sig a:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,192,79,.6)}
.sig a:hover em,.sig a:focus-visible em{max-width:130px;margin-inline-start:0;opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html,body{height:100%;overflow:hidden;cursor:none}
body{background:#050d24;user-select:none}
body.moved{cursor:default}
/* Slow gold and blue light moving behind everything */
.aurora{position:fixed;inset:-20%;filter:blur(60px);opacity:.9}
.aurora b{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora b:nth-child(1){width:60vmax;height:60vmax;left:5%;top:10%;background:radial-gradient(circle,#1b4fc4 0,transparent 65%);animation:float1 38s ease-in-out infinite alternate}
.aurora b:nth-child(2){width:50vmax;height:50vmax;right:0;top:30%;background:radial-gradient(circle,rgba(240,192,79,.38) 0,transparent 62%);animation:float2 46s ease-in-out infinite alternate}
.aurora b:nth-child(3){width:45vmax;height:45vmax;left:30%;bottom:-10%;background:radial-gradient(circle,#0f2f7a 0,transparent 65%);animation:float3 52s ease-in-out infinite alternate}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:3vh 4vw 11vh}
.drift{position:relative;display:grid;justify-items:center;text-align:center;animation:drift 120s ease-in-out infinite alternate}
/* The logo: turning coin with light rays behind it */
.coin{position:relative;width:min(25vh,28vw);aspect-ratio:1;display:grid;place-items:center;margin-block-end:1vh}
.rays{position:absolute;inset:-75%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(240,192,79,.20) 0 5deg,transparent 5deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 80s linear infinite}
.halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,110,.55),transparent 66%);animation:breathe 5s ease-in-out infinite}
.flip{position:relative;width:100%;animation:turn 14s ease-in-out infinite;transform-style:preserve-3d}
.flip img{display:block;width:100%;height:auto;filter:drop-shadow(0 2vh 3vh rgba(0,0,0,.6))}
.shine{position:absolute;inset:4%;border-radius:50%;overflow:hidden;pointer-events:none}
.shine::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.65) 50%,transparent 58%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite}
/* Title row with a candle on each side */
.row{display:flex;align-items:flex-end;justify-content:center;gap:min(4vh,4vw)}
.hello{font:700 min(15vh,13vw)/1.05 "David","Frank Ruhl Libre","Times New Roman",serif;padding:0 .08em .06em;background:linear-gradient(100deg,#b9832a 0%,#f7d774 22%,#fff6d8 34%,#f0c04f 46%,#b9832a 60%,#f7d774 78%,#fff6d8 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2.4vh rgba(240,192,79,.45));animation:gold 9s linear infinite,write 2.4s cubic-bezier(.3,.7,.2,1) .3s both}
.hello.again{animation:gold 9s linear infinite,write2 2.4s cubic-bezier(.3,.7,.2,1) both}
.candle{position:relative;width:min(2.6vh,2.8vw);height:min(15vh,15vw);margin-block-end:1.4vh;border-radius:.6vh .6vh .3vh .3vh;background:linear-gradient(90deg,#d8d2c2,#fffdf6 40%,#e9e2cf);box-shadow:inset 0 -1vh 1.4vh rgba(0,0,0,.12)}
.candle::before{content:"";position:absolute;left:50%;top:-1.1vh;width:.25vh;height:1.3vh;background:#2a2118;transform:translateX(-50%)}
.flame{position:absolute;left:50%;bottom:calc(100% + .8vh);width:min(2.4vh,2.6vw);height:min(5.4vh,5.8vw);transform:translateX(-50%);transform-origin:50% 90%;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 78%,#fff 0 18%,#ffe9a0 30%,#ffb43c 58%,rgba(255,120,20,.0) 74%);animation:flicker 1.6s ease-in-out infinite alternate}
.flame::after{content:"";position:absolute;inset:-180% -260%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.35),transparent 60%);animation:breathe 2.6s ease-in-out infinite}
.candle--b .flame{animation-duration:1.9s;animation-delay:-.7s}
.base{position:absolute;bottom:-1.2vh;left:50%;width:280%;height:1.6vh;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#f7d774,#a8741f)}
.sub{min-height:1.5em;font-size:min(3.8vh,4.2vw);font-weight:600;color:#dbe6ff;transition:opacity .8s,transform .8s}
.sub.out{opacity:0;transform:translateY(.6vh)}
.clock{direction:ltr;margin-block-start:1.4vh;font-size:min(9vh,10vw);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#fff;text-shadow:0 0 3vh rgba(120,170,255,.45)}
.clock i{font-style:normal;animation:blink 2s steps(1) infinite}
.ends{display:grid;justify-items:center;gap:1vh;margin-block-start:.6vh;font-size:min(3vh,3.6vw);color:var(--pale)}
.bar{width:min(46vh,56vw);height:.6vh;border-radius:1vh;background:rgba(255,255,255,.12);overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#b9832a,#f7d774,#fff3c4);box-shadow:0 0 1.4vh rgba(240,192,79,.8);transition:width 1s}
.test{position:fixed;top:2vh;inset-inline:0;z-index:9;text-align:center;font-weight:700;color:var(--night)}
.test span{display:inline-block;padding:6px 18px;border-radius:999px;background:var(--gold)}
.close{position:fixed;top:14px;left:14px;z-index:9;opacity:0;transition:opacity .3s}
body.moved .close{opacity:1}
.close .x{width:48px;height:48px;background:rgba(16,38,90,.9);border:1px solid var(--line);color:var(--ice)}
.ask{position:fixed;top:72px;left:14px;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:420px;padding:14px 16px;background:var(--panel);border:1px solid var(--gold);border-radius:14px;font-weight:600;cursor:default}
.sig{z-index:8;background:none}
.sig a{animation:sigGlow 6s ease-in-out infinite}
@keyframes float1{to{transform:translate(18vw,12vh) scale(1.15)}}
@keyframes float2{to{transform:translate(-20vw,-10vh) scale(.9)}}
@keyframes float3{to{transform:translate(-12vw,-16vh) scale(1.2)}}
@keyframes drift{0%{transform:translate(-3vw,-2vh)}50%{transform:translate(3vw,1.5vh)}100%{transform:translate(-1.5vw,2.5vh)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}
@keyframes turn{0%,76%{transform:rotateY(0)}92%,100%{transform:rotateY(360deg)}}
@keyframes sweep{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@keyframes gold{to{background-position:-220% 0}}
@keyframes write{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 -20% 0)}}
@keyframes write2{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 -20% 0)}}
@keyframes flicker{0%{transform:translateX(-50%) rotate(-2deg) scaleY(1)}35%{transform:translateX(-52%) rotate(2deg) scaleY(1.08)}70%{transform:translateX(-48%) rotate(-1deg) scaleY(.94)}100%{transform:translateX(-50%) rotate(1.5deg) scaleY(1.04)}}
@keyframes blink{50%{opacity:.25}}
@keyframes sigGlow{50%{box-shadow:0 0 22px -2px rgba(240,192,79,.75)}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<canvas id="sky" aria-hidden="true"></canvas>
<p class="test" id="test" hidden><span>תצוגה לבדיקה. בשבת שומר המסך יופיע כך, על כל המסך.</span></p>
<div class="stage"><div class="drift">
  <div class="coin" aria-hidden="true"><div class="rays"></div><div class="halo"></div><div class="flip"><img src="__LOGO__" width="300" height="286" alt=""><div class="shine"></div></div></div>
  <div class="row">
    <div class="candle" aria-hidden="true"><div class="flame"></div><div class="base"></div></div>
    <h1 class="hello" id="hello">שבת שלום</h1>
    <div class="candle candle--b" aria-hidden="true"><div class="flame"></div><div class="base"></div></div>
  </div>
  <p class="sub" id="sub">ומבורך</p>
  <p class="clock" id="clock">--<i>:</i>--</p>
  <div class="ends"><span id="ends"></span><div class="bar" aria-hidden="true"><b id="bar"></b></div></div>
</div></div>
<div class="close"><button class="x" id="x" type="button" aria-label="סגירת שומר המסך">×</button></div>
<div class="ask" id="ask" hidden><span>לסגור את שומר המסך עד סוף השבת?</span><button class="btn btn--gold" id="yes" type="button">לסגור</button><button class="x" id="no" type="button" aria-label="ביטול">×</button></div>
<footer class="sig"><a href="https://onejew.cb-site.com/" target="_blank" rel="noopener" aria-label="נבנה על ידי יהודי אחד ומיוחד. לכל המערכות החינמיות"><span>נבנה על ידי</span><i aria-hidden="true"></i><img src="__EMBLEM__" width="30" height="30" alt=""><b>יהודי אחד ומיוחד</b><em aria-hidden="true">לכל המערכות</em></a></footer>
<script>
(function () {
  "use strict";
  var TOKEN = "__TOKEN__", $ = function (id) { return document.getElementById(id); };
  var test = new URLSearchParams(location.search).get("t") === "1", entry = null, offset = 0, idle = 0, title = "";
  var T = function (d) { return new Date(d).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", hour12: false }); };
  // The screen ends on the night after Shabbat or the holiday, so name the night.
  var Night = function (d) { return new Date(d).getDay() === 6 ? "מוצאי שבת" : "מוצאי החג"; };
  var LINES = {
    shabbat: ["ומבורך", "שבת של מנוחה ושמחה", "שבת של אור ושלווה", "שבת של קדושה"],
    chag: ["ומועדים לשמחה", "חגים וזמנים לששון", "חג של שמחה ואור"]
  }, lines = LINES.shabbat, li = 0;
  function call(path, body) {
    return fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  function shut() { window.close(); }
  // Shows the title as if it is being written, from right to left.
  function setTitle(t) {
    if (t === title) return;
    var h = $("hello"), first = !title;
    title = t; h.textContent = t;
    if (!first) { h.classList.remove("again"); void h.offsetWidth; h.classList.add("again"); }
  }
  function load() {
    call("/api/state").then(function (s) {
      offset = new Date(s.now).getTime() - Date.now();
      entry = s.next[0] || null;
      if (!entry) return;
      var shabbat = entry.name === "ערב שבת";
      setTitle(shabbat ? "שבת שלום" : "חג שמח");
      lines = shabbat ? LINES.shabbat : LINES.chag;
      $("ends").textContent = "שומר המסך ייסגר ב" + Night(entry.end) + " בשעה " + T(entry.end);
      if (!test && Date.now() + offset > new Date(entry.end).getTime()) shut();
    }).catch(function () {});
    if (!test) call("/api/screen-ping", {}).catch(function () {});
  }
  function tick() {
    var n = new Date(Date.now() + offset), p = function (v) { return String(v).padStart(2, "0"); };
    $("clock").innerHTML = p(n.getHours()) + "<i>:</i>" + p(n.getMinutes());
    if (entry) {
      var a = new Date(entry.action).getTime(), z = new Date(entry.end).getTime();
      $("bar").style.width = Math.max(2, Math.min(100, (n.getTime() - a) / (z - a) * 100)) + "%";
      if (!test && n.getTime() > z) shut();
    }
  }
  setTitle("שבת שלום");
  setInterval(function () {
    var s = $("sub"); s.classList.add("out");
    setTimeout(function () { li = (li + 1) % lines.length; s.textContent = lines[li]; s.classList.remove("out"); }, 800);
  }, 9000);
  $("test").hidden = !test;
  load(); tick();
  setInterval(load, 20000); setInterval(tick, 1000);
  // The close button appears only when the mouse moves.
  document.addEventListener("mousemove", function () {
    document.body.classList.add("moved");
    clearTimeout(idle);
    idle = setTimeout(function () { if ($("ask").hidden) document.body.classList.remove("moved"); }, 4000);
  });
  $("x").addEventListener("click", function () { if (test) return shut(); $("ask").hidden = false; });
  $("no").addEventListener("click", function () { $("ask").hidden = true; });
  $("yes").addEventListener("click", function () {
    call("/api/screen-close", { date: entry ? entry.date : "" }).catch(function () {}).then(shut);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (test) shut(); else $("ask").hidden = !$("ask").hidden; } });

  /* Gold stars, sparkles and an occasional shooting star. About 30 frames a second, to stay light. */
  var c = $("sky"), g = c.getContext("2d"), W, H, stars = [], sparks = [], comet = null, last = 0;
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (var i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2.8, s: Math.random() * 6.3, v: 0.00002 + Math.random() * 0.00006, gold: Math.random() < 0.6 });
  function star(x, y, r) { g.beginPath(); for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, d = k % 2 ? r * 0.42 : r; g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } g.closePath(); }
  (function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 33) return; last = t;
    g.clearRect(0, 0, W, H);
    stars.forEach(function (p) {
      p.y -= p.v; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      g.globalAlpha = 0.2 + 0.6 * (Math.sin(t / 900 + p.s) + 1) / 2;
      g.fillStyle = p.gold ? "#f0c04f" : "#cfe0ff"; star(p.x * W, p.y * H, p.r); g.fill();
    });
    // Sparkles rising around the middle
    if (sparks.length < 40 && Math.random() < 0.35) sparks.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * (0.55 + Math.random() * 0.3), vy: 0.3 + Math.random() * 0.7, life: 1 });
    g.fillStyle = "#ffe08a";
    sparks = sparks.filter(function (s) {
      s.y -= s.vy; s.life -= 0.008;
      g.globalAlpha = Math.max(0, s.life) * 0.8; g.beginPath(); g.arc(s.x, s.y, 1.6, 0, 6.3); g.fill();
      return s.life > 0;
    });
    if (!comet && Math.random() < 0.004) comet = { x: W * (0.6 + Math.random() * 0.4), y: H * Math.random() * 0.3, life: 1 };
    if (comet) {
      var tail = g.createLinearGradient(comet.x, comet.y, comet.x + 140, comet.y - 60);
      tail.addColorStop(0, "rgba(255,240,200," + comet.life + ")"); tail.addColorStop(1, "rgba(255,240,200,0)");
      g.globalAlpha = 1; g.strokeStyle = tail; g.lineWidth = 2.2; g.beginPath(); g.moveTo(comet.x, comet.y); g.lineTo(comet.x + 140, comet.y - 60); g.stroke();
      comet.x -= 9; comet.y += 3.9; comet.life -= 0.015; if (comet.life <= 0) comet = null;
    }
    g.globalAlpha = 1;
  })(0);
})();
</script>
</body>
</html>
